<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetTask - Registro</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">s
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                PetTask
            </a>
        </div>
    </nav>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <!-- CARD -->
                <div class="card shadow">

                    <div class="card-body p-4">

                        <h1 class="text-center titulo mb-3">
                            Crear cuenta
                        </h1>

                        <p class="text-center texto mb-4">
                            RF-002 — Registrarse
                        </p>


                        <!-- ALERT -->
                        <div class="alert alerta" role="alert">
                            Completa los datos para crear tu cuenta.
                        </div>


                        <!-- FORMULARIO -->
                        <form>

                            <!-- USUARIO -->
                            <div class="mb-3">

                                <label for="usuario" class="form-label">
                                    Usuario
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="usuario"
                                    placeholder="Ingresa tu usuario"
                                    required>

                            </div>


                            <!-- CONTRASEÑA -->
                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Ingresa tu contraseña"
                                    required>

                            </div>


                            <!-- CONFIRMAR CONTRASEÑA -->
                            <div class="mb-4">

                                <label for="confirmarPassword" class="form-label">
                                    Confirmar contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirmarPassword"
                                    placeholder="Confirma tu contraseña"
                                    required>

                            </div>


                            <!-- BOTÓN REGISTRARSE -->
                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-registrarse">
                                    Registrarse
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- BOTÓN PARA MODAL -->
    <div class="container text-center mb-5">

        <button
            type="button"
            class="btn btn-informacion"
            data-bs-toggle="modal"
            data-bs-target="#modalRegistro">
            Ver información
        </button>

    </div>


    <!-- MODAL -->
    <div
        class="modal fade"
        id="modalRegistro"
        tabindex="-1"
        aria-labelledby="modalRegistroLabel"
        aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="modalRegistroLabel">
                        Registro de usuario
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                    </button>

                </div>

                <div class="modal-body">

                    El RF-002 permite al usuario proporcionar
                    un usuario y una contraseña válidos para
                    crear una cuenta.

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cerrar
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="text-center py-3">

        <p class="mb-0">
            PetTask - RF-002 - Bootstrap 5
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
